services:
  scope-watch:
    build: .
    container_name: scope-watch
    restart: unless-stopped
    env_file: .env
    # токен — Docker secret (файл), а не переменная окружения: не виден в docker inspect
    secrets:
      - tg_bot_token
    volumes:
      - ./data:/data
    # даём текущему прогону дописать базу при docker stop
    stop_grace_period: 5m
    # контейнеру не нужно ничего, кроме исходящей сети и записи в /data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  tg_bot_token:
    file: ./secrets/tg_bot_token
