name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal e2e)"
      - run: go mod verify
      - run: go vet ./...
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Run Go tests and E2E
        run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o bin/scope-watch ./cmd/scope-watch
      - name: Build container
        run: docker build -t scope-watch:test .
      - name: Check container CLI
        run: docker run --rm scope-watch:test /scope-watch --help
